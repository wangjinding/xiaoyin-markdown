<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file: https: http:; font-src 'self' data:;">
  <title>小银 Markdown</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- 工具栏 -->
    <header class="toolbar">
      <div class="brand">
        <span class="brand-name">小银 Markdown</span>
      </div>

      <div class="tb-sep"></div>

      <div class="tb-group">
        <button class="tb-btn" id="btn-new" title="新建 (Ctrl+N)">
          <svg viewBox="0 0 16 16"><path d="M9 1H4a1 1 0 00-1 1v12a1 1 0 001 1h8a1 1 0 001-1V5L9 1zm0 1.5L11.5 5H9V2.5z"/></svg>
          <span>新建</span>
        </button>
        <button class="tb-btn" id="btn-open" title="打开文件 (Ctrl+O)">
          <svg viewBox="0 0 16 16"><path d="M1.5 3.5A1.5 1.5 0 013 2h3l1.5 2H14a1 1 0 011 1v7a1 1 0 01-1 1H2a1 1 0 01-1-1V3.5z"/></svg>
          <span>打开</span>
        </button>
        <button class="tb-btn primary" id="btn-save" title="保存 (Ctrl+S)">
          <svg viewBox="0 0 16 16"><path d="M2 2h9l3 3v9a1 1 0 01-1 1H3a1 1 0 01-1-1V2zm2 0v4h7V2H4zm1 7h6v5H5V9z"/></svg>
          <span>保存</span>
        </button>
        <button class="tb-btn" id="btn-saveas" title="另存为 (Ctrl+Shift+S)">
          <svg viewBox="0 0 16 16"><path d="M8 1v7m0 0L5.5 5.5M8 8l2.5-2.5M2 10v3a1 1 0 001 1h10a1 1 0 001-1v-3"/></svg>
          <span>另存为</span>
        </button>
      </div>

      <div class="tb-sep"></div>

      <div class="tb-group">
        <button class="tb-icon" id="btn-undo" title="撤销 (Ctrl+Z)">
          <svg viewBox="0 0 16 16"><path d="M6 3.5L2 7l4 3.5V8h4a3 3 0 010 6H5v1.5h5a4.5 4.5 0 000-9H6V3.5z"/></svg>
        </button>
        <button class="tb-icon" id="btn-redo" title="重做 (Ctrl+Y)">
          <svg viewBox="0 0 16 16"><path d="M10 3.5L14 7l-4 3.5V8H6a3 3 0 000 6h4v1.5H6a4.5 4.5 0 010-9h4V3.5z"/></svg>
        </button>
        <button class="tb-icon" id="btn-find" title="查找 (Ctrl+F)">
          <svg viewBox="0 0 16 16"><path d="M6.5 1a5.5 5.5 0 014.2 9.05l4.1 4.1-1.05 1.05-4.1-4.1A5.5 5.5 0 116.5 1zm0 1.5a4 4 0 100 8 4 4 0 000-8z"/></svg>
        </button>
        <button class="tb-icon" id="btn-copyall" title="复制全文 (Ctrl+Shift+C)">
          <svg viewBox="0 0 16 16"><path d="M5 1h7a1 1 0 011 1v9h-1.5V2.5H5V1zM3 3.5h7a1 1 0 011 1V14a1 1 0 01-1 1H3a1 1 0 01-1-1V4.5a1 1 0 011-1z"/></svg>
        </button>
        <button class="tb-icon" id="btn-dir" title="打开文件所在文件夹 (Ctrl+Shift+O)">
          <svg viewBox="0 0 16 16"><path d="M1.5 3.5A1.5 1.5 0 013 2h3l1.5 2H14a1 1 0 011 1v7a1 1 0 01-1 1H2a1 1 0 01-1-1V3.5z"/></svg>
        </button>
      </div>

      <div class="spacer"></div>

      <button class="tb-btn toggle" id="btn-tree" title="显示 / 隐藏文件目录 (Ctrl+Shift+B)">
        <svg viewBox="0 0 16 16"><path d="M1.5 3.5A1.5 1.5 0 013 2h3.2l1.4 1.8H14a1 1 0 011 1v1.2H1.5V3.5zM1.5 7.2H15v5.3a1 1 0 01-1 1H2.5a1 1 0 01-1-1V7.2z"/></svg>
        <span>目录</span>
      </button>

      <div class="seg" id="mode-seg">
        <button data-mode="edit" title="编辑模式 (Ctrl+1)">编辑</button>
        <button data-mode="split" class="active" title="分栏模式 (Ctrl+2)">分栏</button>
        <button data-mode="read" title="阅读模式 (Ctrl+3)">阅读</button>
      </div>

      <button class="tb-btn toggle" id="btn-outline" title="显示 / 隐藏章节大纲 (Ctrl+Shift+T)">
        <svg viewBox="0 0 16 16"><path d="M2 3.2h1.8v1.3H2V3.2zm3.4 0H14v1.3H5.4V3.2zM2 7.35h1.8v1.3H2v-1.3zm3.4 0H14v1.3H5.4V7.35zM2 11.5h1.8v1.3H2v-1.3zm3.4 0H14v1.3H5.4v-1.3z"/></svg>
        <span>大纲</span>
      </button>

      <button class="tb-btn" id="btn-openmode" title="文档打开方式：标签页 / 独立窗口（点击切换）">
        <svg viewBox="0 0 16 16"><path d="M1.5 2.5h13v11h-13z" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5 2.5v11M2.5 5h1.8M2.5 8h1.8M2.5 11h1.8" stroke="currentColor" stroke-width="1.2"/></svg>
        <span id="openmode-label">标签</span>
      </button>


      <button class="tb-icon" id="btn-theme" title="切换深色/浅色 (Ctrl+Shift+L)">
        <svg viewBox="0 0 16 16"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zm0 1.5v11a5.5 5.5 0 010-11z"/></svg>
      </button>
    </header>

    <!-- 标签栏（标签页模式下显示） -->
    <div class="tabbar" id="tabbar"></div>

    <!-- 查找条 -->
    <div class="findbar" id="findbar" hidden>
      <input type="text" id="find-input" placeholder="查找内容…" spellcheck="false">
      <span class="find-count" id="find-count"></span>
      <button id="find-prev" title="上一个 (Shift+Enter)">↑</button>
      <button id="find-next" title="下一个 (Enter)">↓</button>
      <button id="find-close" title="关闭 (Esc)">✕</button>
    </div>

    <!-- 工作区 -->
    <main class="workspace" id="workspace" data-mode="split">
      <aside class="sidebar" id="sidebar" hidden>
        <div class="panel-head">
          <svg class="panel-ico" viewBox="0 0 16 16"><path d="M1.5 3.5A1.5 1.5 0 013 2h3.2l1.4 1.8H14a1 1 0 011 1v1.2H1.5V3.5zM1.5 7.2H15v5.3a1 1 0 01-1 1H2.5a1 1 0 01-1-1V7.2z"/></svg>
          <span class="panel-title" id="sb-title">目录</span>
          <span class="panel-actions">
            <button class="sb-btn" id="sb-pick" title="选择文件夹 (Ctrl+Shift+K)">
              <svg viewBox="0 0 16 16"><path d="M1.5 3.5A1.5 1.5 0 013 2h3l1.5 2H14a1 1 0 011 1v7a1 1 0 01-1 1H2a1 1 0 01-1-1V3.5z"/></svg>
            </button>
            <button class="sb-btn" id="sb-close" title="隐藏文件目录 (Ctrl+Shift+B)">
              <svg viewBox="0 0 16 16"><path d="M3.4 2.6L8 7.2l4.6-4.6 1.1 1.1L9.1 8.3l4.6 4.6-1.1 1.1L8 9.4l-4.6 4.6-1.1-1.1 4.6-4.6-4.6-4.6z"/></svg>
            </button>
          </span>
        </div>
        <div class="sb-body" id="sb-body"></div>
      </aside>

      <div class="vsplitter" id="sb-splitter" title="拖动调整目录宽度"></div>

      <section class="pane editor-pane" id="editor-pane">
        <div class="editor-wrap">
          <div class="editor-hl" id="editor-hl" aria-hidden="true"></div>
          <textarea id="editor" spellcheck="false" autocomplete="off"
                    placeholder="在这里写 Markdown…&#10;&#10;也可以把 .md 文件直接拖进窗口。"></textarea>
        </div>
      </section>

      <div class="splitter" id="splitter" title="拖动调整宽度"></div>

      <section class="pane preview-pane" id="preview-pane">
        <article class="markdown-body" id="preview"></article>
      </section>

      <div class="vsplitter" id="ol-splitter" title="拖动调整大纲宽度"></div>

      <aside class="outline" id="outline">
        <div class="panel-head">
          <svg class="panel-ico" viewBox="0 0 16 16"><path d="M2 3.2h1.8v1.3H2V3.2zm3.4 0H14v1.3H5.4V3.2zM2 7.35h1.8v1.3H2v-1.3zm3.4 0H14v1.3H5.4V7.35zM2 11.5h1.8v1.3H2v-1.3zm3.4 0H14v1.3H5.4v-1.3z"/></svg>
          <span class="panel-title">章节大纲</span>
          <span class="ol-count" id="ol-count">0</span>
          <button class="sb-btn" id="ol-close" title="隐藏章节大纲 (Ctrl+Shift+T)">
            <svg viewBox="0 0 16 16"><path d="M3.4 2.6L8 7.2l4.6-4.6 1.1 1.1L9.1 8.3l4.6 4.6-1.1 1.1L8 9.4l-4.6 4.6-1.1-1.1 4.6-4.6-4.6-4.6z"/></svg>
          </button>
        </div>
        <div class="ol-body" id="ol-body"></div>
      </aside>
    </main>

    <!-- 状态栏 -->
    <footer class="statusbar">
      <div class="st-left">
        <span class="st-file" id="st-file">未命名</span>
        <span class="st-dirty" id="st-dirty" hidden>未保存</span>
      </div>
      <div class="st-right">
        <span id="st-words">0 字</span>
        <span class="st-div">|</span>
        <span id="st-chars">0 字符</span>
        <span class="st-div">|</span>
        <span id="st-cursor">第 1 行, 第 1 列</span>
        <span class="st-div">|</span>
        <span>UTF-8</span>
        <span class="st-div">|</span>
        <span id="st-ver" title="当前版本">v2.6.5</span>
        <span class="st-div">|</span>
        <a class="st-link" id="btn-update" title="检查更新">检查更新</a>
      </div>
    </footer>

    <!-- 右键菜单 -->
    <div class="ctx-menu" id="ctxmenu" hidden></div>
    <div class="toast" id="toast" hidden></div>
    <div class="drop-hint" id="drop-hint" hidden><div>松开鼠标：文件直接打开，文件夹列出目录</div></div>
  </div>

  <script src="markdown.js"></script>
  <script src="tauri-bridge.js"></script>
  <script src="app.js"></script>
</body>
</html>
