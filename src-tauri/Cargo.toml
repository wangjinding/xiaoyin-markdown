[package]
name = "xiaoyin-markdown"
version = "2.6.5"
description = "小银 Markdown —— 轻量本地 Markdown 编辑器"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
# 在线升级：官方 updater（minisign 签名校验）+ process（升级后重启）
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
serde_json = "1"
# —— 三端：平台专属依赖各归各的 ——
# Windows：剪贴板里放「文件本身」要靠 Win32 的 CF_HDROP
[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging"
] }

# macOS / Linux：文本剪贴板用 arboard（macOS 走 NSPasteboard，Linux 走 X11/Wayland）
[target.'cfg(not(windows))'.dependencies]
arboard = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
